# DMS Matugen theme for Yazi. Keep the terminal background transparent.
[app]
overall = { fg = "{{colors.on_surface.default.hex}}", bg = "reset" }

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }
find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bg = "reset", italic = true }
marker_copied = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_copied = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
count_cut = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
border_symbol = "│"
border_style = { fg = "{{colors.outline.default.hex}}" }

[tabs]
active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "reset" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
unset_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[indicator]
parent = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
current = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
preview = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[status]
overall = { fg = "{{colors.on_surface.default.hex}}", bg = "reset" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "{{colors.on_primary.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error_container.default.hex}}" }
perm_type = { fg = "{{colors.primary.default.hex}}" }
perm_read = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec = { fg = "{{colors.secondary.default.hex}}" }
perm_sep = { fg = "{{colors.outline.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
value = { fg = "{{colors.on_surface.default.hex}}" }
selected = { reversed = true }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[confirm]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no = { fg = "{{colors.on_surface.default.hex}}" }

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }

[tasks]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.primary.default.hex}}", bold = true }

[which]
border = { fg = "{{colors.primary.default.hex}}" }
mask = { bg = "{{colors.surface_variant.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}" }
rest = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc = { fg = "{{colors.secondary.default.hex}}" }
separator = "  "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[help]
border = { fg = "{{colors.primary.default.hex}}" }
chord = { fg = "{{colors.primary.default.hex}}" }
action = { fg = "{{colors.on_surface_variant.default.hex}}" }
hovered = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }

[notify]
title_info = { fg = "{{colors.primary.default.hex}}" }
title_warn = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[spot]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tbl_col = { bold = true }

[filetype]
rules = [
  { mime = "**/image/*", fg = "{{colors.tertiary.default.hex}}" },
  { mime = "**/{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio}", fg = "{{colors.error.default.hex}}" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "{{colors.secondary.default.hex}}" },
  { url = "*", is = "orphan", fg = "{{colors.error.default.hex}}" },
  { url = "*", is = "exec", fg = "{{colors.secondary.default.hex}}" },
  { url = "*/", fg = "{{colors.primary.default.hex}}" },
  { url = "*", fg = "{{colors.on_surface.default.hex}}" },
]
