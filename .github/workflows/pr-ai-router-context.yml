name: AI router/context acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  router-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ github.token }}
          extra-conf: |
            accept-flake-config = true

      - name: Evaluate router, context, and full-stack shells
        run: |
          set -eu
          for shell in \
            Victus-ai \
            Victus-ai-9router \
            Victus-ai-omniroute \
            Victus-ai-headroom \
            Victus-ai-hermes-hindsight-9router \
            Victus-ai-hermes-hindsight-headroom-9router \
            Victus-ai-hermes-hindsight-headroom-omniroute
          do
            nix eval --raw ".#devShells.x86_64-linux.$shell.drvPath" >/dev/null
          done

      - name: Prove default AI alias selects most capable OmniRoute stack
        run: |
          set -eu
          HOME="$(mktemp -d)" nix develop .#Victus-ai --command sh -lc '
            set -eu
            test "$AI_PRESET" = hermes-hindsight-headroom-omniroute
            test "$OPENAI_BASE_URL" = "$HEADROOM_BASE_URL/v1"
            test "$OPENAI_TARGET_API_URL" = "$OMNIROUTE_BASE_URL"
          '

      - name: Run 9Router and Headroom contract tests
        run: sh .github/scripts/ai-router-context-e2e.sh
