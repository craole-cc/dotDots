name: AI devshell acceptance

on:
  push:
    branches:
      - ai/hermes-hindsight-cleanup
  pull_request:
    branches:
      - main

jobs:
  ai-devshells:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate AI shells
        run: |
          set -eu

          for system in x86_64-linux aarch64-linux; do
            for shell in ai ai-hermes ai-hindsight; do
              nix eval --raw ".#devShells.${system}.${shell}.drvPath" > /dev/null
            done
          done

      - name: Smoke-test Hermes shell
        run: |
          set -eu
          test_home="$(mktemp -d)"

          HOME="$test_home" nix develop .#ai-hermes --command sh -lc '
            set -eu

            test "$HERMES_HOME" = "$HOME/.hermes"
            test "$HERMES_GATEWAY_CFG" = "$HERMES_HOME/gateway.json"

            command -v hermes > /dev/null
            command -v hermes-help > /dev/null
            command -v configure-hindsight > /dev/null
            command -v hermes-gateway > /dev/null
            command -v hermes-gateway-service > /dev/null

            hermes --help > /dev/null
            hermes-help > /dev/null

            configure-hindsight --force
            test -s "$HERMES_HOME/hindsight/config.json"
            grep -F "\"api_url\": \"$HINDSIGHT_API_URL\"" "$HERMES_HOME/hindsight/config.json" > /dev/null
            grep -F "\"bank_id\": \"$HINDSIGHT_BANK_ID\"" "$HERMES_HOME/hindsight/config.json" > /dev/null
          '

      - name: Smoke-test Hindsight shell
        run: |
          set -eu
          test_home="$(mktemp -d)"

          HOME="$test_home" nix develop .#ai-hindsight --command sh -lc '
            set -eu

            command -v hindsight-help > /dev/null
            command -v hindsight-up > /dev/null
            command -v hindsight-down > /dev/null
            command -v hindsight-status > /dev/null
            command -v hindsight-verify > /dev/null
            command -v hindsight-bank-create > /dev/null
            command -v hindsight-bank-list > /dev/null

            hindsight-help > /dev/null

            export HINDSIGHT_BIND_ADDRESS=127.0.0.1
            export HINDSIGHT_API_URL=http://127.0.0.1:8888
            export HINDSIGHT_DATA_DIR="$HOME/.local/share/hindsight"
            export HINDSIGHT_SECRETS_FILE="$HOME/Private/hindsight.env"

            mkdir -p "$HOME/Private"
            printf "%s\n" "HINDSIGHT_API_LLM_API_KEY=ci-dummy-key" > "$HINDSIGHT_SECRETS_FILE"

            set -a
            . "$HINDSIGHT_SECRETS_FILE"
            set +a

            docker compose \
              -p "$HINDSIGHT_COMPOSE_PROJECT" \
              -f "$HINDSIGHT_COMPOSE_FILE" config > /dev/null

            hindsight-up
            trap "hindsight-down" EXIT HUP INT TERM
            hindsight-status
            hindsight-verify
            hindsight-down
            trap - EXIT HUP INT TERM
          '

      - name: Smoke-test combined AI shell
        run: |
          set -eu
          test_home="$(mktemp -d)"

          HOME="$test_home" nix develop .#ai --command sh -lc '
            set -eu

            command -v hermes > /dev/null
            command -v configure-hindsight > /dev/null
            command -v hindsight-help > /dev/null
            command -v hindsight-status > /dev/null

            if env | grep -q "^OMNIROUTE_"; then
              echo "OmniRoute environment leaked into .#ai" >&2
              exit 1
            fi

            if env | grep -q "^MEM0_"; then
              echo "Mem0 environment leaked into .#ai" >&2
              exit 1
            fi
          '
