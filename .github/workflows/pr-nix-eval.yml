name: AI devshell acceptance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ github.token }}
          extra-conf: |
            accept-flake-config = true

      - name: Validate host AI runtime overrides
        run: |
          set -eu
          oracle_schema="$(nix eval --raw .#lib.schema.hosts.TheOracle.shells.ai.hindsight.runtime)"
          oracle_shell="$(nix eval --raw .#devShells.aarch64-linux.TheOracle-ai-hermes-hindsight-omniroute.HINDSIGHT_RUNTIME_KIND)"
          victus_schema="$(nix eval --raw .#lib.schema.hosts.Victus.shells.ai.hindsight.runtime)"
          victus_shell="$(nix eval --raw .#devShells.x86_64-linux.Victus-ai-hermes-hindsight-omniroute.HINDSIGHT_RUNTIME_KIND)"
          printf 'TheOracle: schema=%s shell=%s\n' "$oracle_schema" "$oracle_shell"
          printf 'Victus: schema=%s shell=%s\n' "$victus_schema" "$victus_shell"
          test "$oracle_schema" = docker
          test "$oracle_shell" = docker
          test "$victus_schema" = native
          test "$victus_shell" = native

      - name: Validate Victus core recovery contract
        run: |
          set -eu
          enabled_users="$(nix eval --json .#lib.schema.hosts.Victus.users.names.enabled)"
          craole_normal="$(nix eval --json .#nixosConfigurations.Victus.config.users.users.craole.isNormalUser)"
          craole_password_null="$(nix eval --json .#nixosConfigurations.Victus.config.users.users.craole --apply 'user: user.password == null')"
          craole_hashed_set="$(nix eval --json .#nixosConfigurations.Victus.config.users.users.craole --apply 'user: user.hashedPassword != null')"
          wm="$(nix eval --raw .#nixosConfigurations.Victus.config._.resolved.interface.windowManager)"
          de="$(nix eval --raw .#nixosConfigurations.Victus.config._.resolved.interface.desktopEnvironment)"
          panel="$(nix eval --raw .#nixosConfigurations.Victus.config._.resolved.interface.panel)"
          protocol="$(nix eval --raw .#nixosConfigurations.Victus.config._.resolved.interface.displayProtocol)"
          hyprland="$(nix eval --json .#nixosConfigurations.Victus.config.programs.hyprland.enable)"
          xwayland="$(nix eval --json .#nixosConfigurations.Victus.config.programs.xwayland.enable)"
          gnome="$(nix eval --json .#nixosConfigurations.Victus.config.services.desktopManager.gnome.enable)"
          dms_shell="$(nix eval --json .#nixosConfigurations.Victus.config.programs.dms-shell.enable)"
          greeter="$(nix eval --json .#nixosConfigurations.Victus.config.services.displayManager.dms-greeter.enable)"
          session="$(nix eval --raw .#nixosConfigurations.Victus.config.services.displayManager.defaultSession)"
          printf 'Victus: users=%s craole.normal=%s password.null=%s hash.set=%s wm=%s de=%s panel=%s protocol=%s hyprland=%s xwayland=%s gnome=%s dms-shell=%s dms-greeter=%s session=%s\n' "$enabled_users" "$craole_normal" "$craole_password_null" "$craole_hashed_set" "$wm" "$de" "$panel" "$protocol" "$hyprland" "$xwayland" "$gnome" "$dms_shell" "$greeter" "$session"
          printf '%s' "$enabled_users" | grep -q 'craole'
          test "$craole_normal" = true
          test "$craole_password_null" = true
          test "$craole_hashed_set" = true
          test "$wm" = hyprland
          test "$de" = gnome
          test "$panel" = dms-shell
          test "$protocol" = wayland
          test "$hyprland" = true
          test "$xwayland" = true
          test "$gnome" = true
          test "$dms_shell" = true
          test "$greeter" = true
          test "$session" = hyprland-dms-uwsm

      - name: Validate Victus staged Home contract
        run: |
          set -eu
          home_user="$(nix eval --raw .#nixosConfigurations.Victus.config.home-manager.users.craole.home.username)"
          home_wm="$(nix eval --raw .#nixosConfigurations.Victus.config.home-manager.users.craole._.resolved.interface.windowManager)"
          home_panel="$(nix eval --raw .#nixosConfigurations.Victus.config.home-manager.users.craole._.resolved.interface.panel)"
          home_hyprland="$(nix eval --json .#nixosConfigurations.Victus.config.home-manager.users.craole.wayland.windowManager.hyprland.enable)"
          home_dms="$(nix eval --json .#nixosConfigurations.Victus.config.home-manager.users.craole.programs.dank-material-shell.enable)"
          printf 'Victus Home: user=%s wm=%s panel=%s hyprland=%s dms=%s\n' "$home_user" "$home_wm" "$home_panel" "$home_hyprland" "$home_dms"
          test "$home_user" = craole
          test "$home_wm" = hyprland
          test "$home_panel" = dms-shell
          test "$home_hyprland" = false
          test "$home_dms" = true

      - name: Evaluate Victus system derivation without warnings
        run: NIX_ABORT_ON_WARN=1 nix eval --show-trace --raw .#nixosConfigurations.Victus.config.system.build.toplevel.drvPath >/dev/null

      - name: Inspect devshell exports
        run: |
          set -eu
          printf '%s\n' 'devShell systems:'
          nix eval --json .#devShells --apply builtins.attrNames
          printf '%s\n' 'x86_64-linux devShells:'
          nix eval --json .#devShells.x86_64-linux --apply builtins.attrNames

      - name: Evaluate all host-qualified shells
        run: |
          set -eu
          nix eval --json .#devShells \
            --apply 'systems: builtins.mapAttrs (_: shells: builtins.mapAttrs (_: shell: shell.drvPath) shells) systems' \
            >/dev/null

  ai-presets:
    needs: ai-eval
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - hermes
          - hermes-hindsight
          - hermes-mem0
          - hermes-hindsight-omniroute

    name: e2e-${{ matrix.preset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ github.token }}
          extra-conf: |
            accept-flake-config = true

      - name: Run preset end-to-end
        run: sh .github/scripts/ai-preset-e2e.sh "${{ matrix.preset }}"

  ai-contracts:
    needs: ai-eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ github.token }}
          extra-conf: |
            accept-flake-config = true

      - name: Smoke-test preset instance isolation
        run: |
          set -eu
          test_home="$(mktemp -d)"

          HOME="$test_home" \
          AI_INSTANCE=work \
          AI_PORT_OFFSET=100 \
            nix develop .#Victus-ai-hermes-hindsight-omniroute --command sh -lc '
              set -eu

              test "$AI_INSTANCE" = work
              test "$AI_HOME" = "$HOME/.local/share/ai/hermes-hindsight-omniroute/work"
              test "$HINDSIGHT_INSTANCE" = work
              test "$HINDSIGHT_SECRETS_FILE" = "$HOME/Private/hindsight.env"
              test "$HINDSIGHT_COMPOSE_PROJECT" = hindsight-work
              test "$HINDSIGHT_CONTAINER_NAME" = hindsight-work
              test "$HINDSIGHT_API_PORT" = 8988
              test "$HINDSIGHT_MCP_PORT" = 10099
              test "$HINDSIGHT_UI_PORT" = 8989
              test "$HINDSIGHT_API_URL" = http://127.0.0.1:8988
              test "$OMNIROUTE_DATA_DIR" = "$AI_HOME/omniroute"
              test "$OMNIROUTE_PORT" = 20228
              test "$OMNIROUTE_SESSION" = hermes-hindsight-omniroute-work-omniroute
            '

      - name: Smoke-test default AI alias
        run: |
          set -eu
          test_home="$(mktemp -d)"

          HOME="$test_home" nix develop .#Victus-ai --command sh -lc '
            set -eu
            test "$AI_PRESET" = hermes-hindsight
            test "$AI_HOME" = "$HOME/.local/share/ai/hermes-hindsight/default"
            test "$HINDSIGHT_INSTANCE" = default
            test "$HINDSIGHT_COMPOSE_PROJECT" = hindsight-default
          '
