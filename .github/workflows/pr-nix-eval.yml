name: PR Nix evaluation

on:
  push:
    branches:
      - ai/hermes-hindsight-cleanup
  pull_request:
    branches:
      - main

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Inspect TheOracle schema
        run: |
          nix eval --json .#lib --apply '
            lib:
            let
              lix = lib.libraries.default;
              schema = lix.schema.construction.mkSchema {};
              core = lix.schema.core;
              home = lix.schema.home;
              recursiveUpdate = lix.attrsets.aggregation.recursiveUpdate;
              rawHost = schema.hosts.raw.TheOracle;
              rawUsers = schema.users.raw;
              users = home.mkUsers { users = rawUsers; };
              paths = schema.global.paths or {};
              direct = home.mkHome {
                host = rawHost;
                inherit users;
              };
              directWithPaths = home.mkHome {
                host = rawHost;
                inherit users;
                roots = paths.roots or {};
                stems = paths.stems or {};
              };
              merged = recursiveUpdate rawHost { users = directWithPaths; };
              directCore = core.mkCore (
                {
                  name = "TheOracle";
                  host = rawHost;
                  inherit users;
                }
                // paths
              );
              host = schema.hosts.TheOracle;
            in {
              rawPrincipalNames = map (p: p.name or null) (rawHost.principals or []);
              rawHostUserKeys = builtins.attrNames (rawHost.users or {});
              directEnabled = builtins.attrNames direct.enabled;
              directWithPathsEnabled = builtins.attrNames directWithPaths.enabled;
              mergedEnabled = builtins.attrNames (merged.users.enabled or {});
              directCoreEnabled = builtins.attrNames (directCore.users.enabled or {});
              directCoreInteractive = builtins.attrNames (directCore.users.interactive or {});
              directCorePrimary = (directCore.users.primary or {}).name or null;
              schemaEnabled = builtins.attrNames (host.users.enabled or {});
              schemaInteractive = builtins.attrNames (host.users.interactive or {});
              schemaPrimary = (host.users.primary or {}).name or null;
            }
          '

      - name: Evaluate flake
        run: nix flake check --no-build --show-trace
