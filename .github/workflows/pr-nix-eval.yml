name: PR Nix evaluation

on:
  push:
    branches:
      - ai/hermes-hindsight-cleanup
  pull_request:
    branches:
      - main

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Inspect TheOracle schema
        run: |
          nix eval --json .#lib --apply '
            lib:
            let
              schema = lib.libraries.default.schema.construction.mkSchema {};
              host = schema.hosts.TheOracle;
            in {
              interactive = builtins.attrNames (host.users.interactive or {});
              primary = (host.users.primary or {}).name or null;
              primaryUser = (host.users.names or {}).primaryUser or null;
              enabled = builtins.attrNames (host.users.enabled or {});
            }
          '

      - name: Evaluate flake
        run: nix flake check --no-build --show-trace
