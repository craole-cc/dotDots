# Canonical tool versions for dotDots.
# Nix reads this via builtins.fromTOML in the flake.
# mise reads the generated .config/mise.toml on systems without Nix.
# Run: python3 scripts/sync_toolchain.py to regenerate adapters.
# Run: python3 scripts/sync_toolchain.py --check to verify freshness.
schema = 1

[tools]
bat = "0.26.1"
cargo = "1.95.0"
direnv = "2.37.1"
eza = "0.23.4"
fd = "10.4.2"
gcc = "15.2.0"
jq = "1.8.1"
lsd = "1.2.0"
mise = "2026.5.12"
nil = "2025-06-13"
nushell = "0.112.2"
pandoc = "3.7.0.2"
ripgrep = "15.1.0"
rustc = "1.95.0"
sd = "1.1.0"
starship = "1.25.1"
tldr = "3.4.4"
typst = "0.14.2"
yazi = "26.5.6"
zoxide = "0.9.9"
[tasks]
check = { description = "Verify toolchain freshness and run flake check", run = ["python3 scripts/sync_toolchain.py --check", "nix flake check --no-build"] }
toolchain-sync = { description = "Regenerate toolchain adapters from .config/toolchain.toml", run = "python3 scripts/sync_toolchain.py" }
