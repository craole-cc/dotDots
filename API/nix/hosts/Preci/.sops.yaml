# .sops.yaml
#
# Host-level creation rules. `sups` passes this file explicitly with --config,
# and sops otherwise discovers it by walking up from the file being edited.
#
# The root .sops.yaml is the authority: it carries the `craole` anchor for
# user-scoped secrets and the machine anchors, which a host cannot know on its
# own. This file exists so a host can be encrypted or re-encrypted with only its
# own key, without depending on the shared config.
#
# Scoped to this host's own secrets only. A user's files under
# specs/users/<name>/secrets/ are owned by the root config, so bare `sops` on
# one of those is given the root config explicitly:
#
#   sops --config ../../../../.sops.yaml specs/users/<user>/secrets/host.yaml
#
# Decryption never consults this file: recipients come from the encrypted file's
# own metadata. It only decides who a newly created or re-encrypted file is
# encrypted to.
keys:
  - &preci age14pc63ggn66ehww7zfll9p4xntfrhx6h520u79svv2l2ua7czmf9sjtzfp5
creation_rules:
  - path_regex: '(^|/)secrets/secrets\.yaml$'
    key_groups:
      - age: [*preci]