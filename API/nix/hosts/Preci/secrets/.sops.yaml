# .sops.yaml
#
# Creation rules for this host's encrypted secrets. SOPS discovers this file by
# walking up from the file being edited or decrypted, so it applies to
# `secrets.yaml` in this directory only. Per-user secrets under
# `specs/users/<name>/secrets.yaml` are covered by their own `.sops.yaml`,
# because that walk stops at the first directory that has one.
keys:
  - &preci age14pc63ggn66ehww7zfll9p4xntfrhx6h520u79svv2l2ua7czmf9sjtzfp5
creation_rules:
  - path_regex: '(^|/)secrets\.yaml$'
    key_groups:
      - age: [*preci]