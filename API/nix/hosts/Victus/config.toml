stateVersion = "25.05"
system = "x86_64-linux"
class = "nixos"
id = "d2c1db8e"         # > head -c8 /etc/machine-id

[paths]
src = "/home/craole/Downloads/public/dotDots"
# wallpapers = "/home/craole/.dots/Assets/Images/wallpaper"

[modules]
kernel = [
  "nvme",
  "xhci_pci",
  "usbhid",
  "usb_storage",
  "sd_mod",
  "rtsx_pci_sdmmc",
]

[specs]
machine = "laptop"

[specs.cpu]
arch = "x86_64"
brand = "amd"             # TODO: Change this to allow multiple
powerMode = "performance"
cores = 12

[specs.gpu]
mode = "hybrid" # or "offload", "sync", "primary-nvidia", etc.

[specs.gpu.primary]
brand = "amd"
busId = "PCI:6:0:0"
model = "Radeon 680M"

[specs.gpu.secondary]
brand = "nvidia"
busId = "PCI:1:0:0"
model = "RTX 2050"

[devices]
network = ["eno1", "wlo1"]

[devices.boot."luks-03a38b8f-5279-4c0f-9172-a7878fbcc92d"]
device = "/dev/disk/by-uuid/03a38b8f-5279-4c0f-9172-a7878fbcc92d"

[devices.file."/"]
device = "/dev/disk/by-uuid/6494d9f3-9b6b-43ee-b0c9-6abeec96bf38"
fsType = "ext4"

[devices.file."/boot"]
device = "/dev/disk/by-uuid/3C12-4AC5"
fsType = "vfat"
options = ["fmask=0077", "dmask=0077"]

[[devices.swap]]
device = "/dev/disk/by-uuid/d9e04286-b70c-4c8a-8691-a9a9cbcf57fe"

[devices.display."eDP-1"]
brand = "AUO"
resolution = "1920x1080"
refreshRate = 144
scale = 1
position = "0x0"
size = 15.6
priority = 0

[devices.display."HDMI-A-1"]
brand = "ACER"
resolution = "1920x1080"
refreshRate = 100
scale = 1
position = "0x1080"
# transform = 3
size = 24.5
priority = 2

[localization]
latitude = 18.015
longitude = -77.49
city = "Mandeville, Jamaica"
# locator = "geoclue2"
timeZone = "America/Jamaica"
defaultLocale = "en_US.UTF-8"

functionalities = [
  "audio",
  "battery",
  "bluetooth",
  "dualboot-windows",
  "efi",
  "gpu",
  "keyboard",
  "network",
  "nvme",
  "secureboot",
  "storage",
  # "touchpad", # Currently not functional
  "tpm",
  "video",
  "virtualization",
  "vpn",
  "webcam",
  "wired",
  "wireless",
]

[access]
ssh = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFuAgYKymJKvky9sAhU0wjHPHbGt+Hg0KLOTIYjoZ9tw root@nixos"
# age = "age1j5cug724x386nygk8dhc38tujhzhp9nyzyelzl0yaz3ndgtq3qwqxtkfpv"

[access.remote.ssh]
enable = true
keyOnly = true

[access.remote.tailscale]
enable = true

[access.remote.caddy]
enable = false

[access.firewall.tcp]
ports = [22, 80, 443, 1678, 1876]

[[access.firewall.tcp.ranges]]
from = 49160
to = 65534

[access.firewall.udp]
ports = []

[[access.firewall.udp.ranges]]
from = 49160
to = 65534

nameservers = ["1.1.1.1", "1.0.0.1"] # Cloudflare DNS

[access.vpn]
configFile = "/etc/openvpn/protonvpn-us.ovpn"
# Apps routed through the VPN namespace
apps = ["freetube", "chromium"]

[network]
backend = "networkmanager"

[[principals]]
name = "craole"
enable = true
autoLogin = false
role = "administrator"

[[principals]]
name = "cc"
enable = false
autoLogin = false
role = "service"

[[principals]]
name = "qyatt"
enable = false
autoLogin = false
role = "guest"

[interface]
bootLoader = "systemd-boot"
bootLoaderTimeout = 1
# desktopEnvironment = "plasma"
windowManager = "hyprland"
# displayProtocol = "wayland"
# session = "niri"
# [interface.keyboard]
# modifier = "SUPER"
# swapCapsEscape = true
