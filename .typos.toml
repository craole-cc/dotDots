[files]
  extend-exclude = [
    "vendor/**",
    "**/*.min.js",
    "**/*.lock",
    ".typos.toml",
    "Libraries/posix/output/use_TPUT1",
    "Libraries/posix/template/**",
  ]
  ignore-hidden = true
  ignore-files = true

# Default engine behaviour
[default]
  binary = false
  check-filename = true
  check-file = true
  unicode = true
  locale = "en-us"
  # Ignore short hex fragments (colours, UUID pieces, etc.)
  extend-ignore-re = ["[0-9a-fA-F]{2,}"]

  [default.extend-identifiers]
    "color" = "color"
    "favorites" = "favorites"

  [default.extend-words]
    ags = "ags"
    optimise = "optimise"
    dots-fetch = "dots-fetch"
    shotcut = "shotcut"
    nitch = "nitch"
