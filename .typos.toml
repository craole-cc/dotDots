# File selection options
[files]
  extend-exclude = ["vendor/**", "**/*.min.js", "**/*.lock", ".typos.toml"]
  ignore-hidden = true
  ignore-files = true

# Default engine behaviour
[default]
  binary = false
  check-filename = true
  check-file = true
  unicode = true
  locale = "en-us"
  # Ignore short hex fragments (colours, UUID pieces, etc.)
  extend-ignore-re = ["[0-9a-fA-F]{2,}"]

  # Custom dictionary entries
  [default.extend-identifiers]
    myidentifier = "myidentifier"  # Always valid
    mispeled = "misspelled"        # Will be corrected
    "colour" = "color"
    "nitch" = "nitch"
    "favourites" = "favourites"

  [default.extend-words]
    ags = "ags"
    optimise = "optimise"
    dots-fetch = "dots-fetch"
