# .sops.yaml
#
# Trust domains for every encrypted file in this repo.
#
# The organising idea is *ownership*, not convenience. A secret is encrypted to
# the keys of whoever owns it, and ownership falls into three kinds. Keeping
# them separate is what makes per-machine attribution possible without giving
# every machine every credential.
#
#   machine-owned  Belongs to a computer, or to one deployment *on* a computer.
#                  A tailscale authkey for Preci is meaningless on QBX. An
#                  OpenRouter key issued per host is the same idea applied to a
#                  service account: it exists so spend can be attributed to a
#                  machine. Readable by the machines that need it.
#
#   person-owned   Belongs to a human and follows them. A credential that is
#                  billed to the *account* rather than issued per machine: the
#                  same value is correct everywhere that person runs, so
#                  duplicating it per host buys nothing and multiplies the
#                  number of keys that must be revoked. Reading one should not
#                  require access to any particular host.
#
#   recovery       Offline only. A machine key dies with its disk; without this,
#                  every machine-owned secret would be permanently unreadable.
#
# A private key never appears here. This file lists only *public* keys, which is
# what makes it safe to commit. Each private half stays on its own machine, and
# each person's lives in a password manager.
#
# Adding a machine: generate a keypair on it
# (`age-keygen -o ~/.config/sops/age/keys.txt`), add its public key under
# Machines below with an anchor, then run `sops updatekeys` on the files it now
# needs. No private key is ever copied to another machine.
#
# First match wins, and there is deliberately no catch-all, so an unrecognised
# path fails loudly instead of being encrypted to the wrong recipients.
# `(^|/)` makes a segment match whether the path is relative or absolute.
#
# A host's own rules live in API/nix/hosts/<host>/.sops.yaml, which `sups`
# passes explicitly; these are the fallback for hosts without one, and the
# authority for cross-host ("global") secrets.
keys:
  #~@ Machines. One per host; see the note above on adding one.
  - &preci age14pc63ggn66ehww7zfll9p4xntfrhx6h520u79svv2l2ua7czmf9sjtzfp5
  - &victus age1nm2k92daeyahrkn64z23k9chxfpz64t609arypfj3vqpej043vlsra07rt

  #~@ People. One per human. Their person-owned files stay readable to them on
  #>  any machine they use, which is the whole point of the domain: a
  #>  person-owned credential must not depend on a host surviving.
  - &craole age1l0stcgnv9hy8l687399y4x45furspu55fj72vcrqkv39zqxtnq7qfhhevl

  #~@ Recovery. Offline-only. Keep the private half in a password manager and
  #>  off this machine; it exists only for restoring secrets when every other
  #>  key is unavailable. Present in every group below.
  - &recovery age1055fks2uwfhpc3wnc7d0s2gvne89hh8e0x38c7j65mpzv2s3jc6qngsr0q

creation_rules:
  #~@ Machine-owned, on a host: hosts/<host>/secrets/secrets.yaml
  #>  The host's own credentials. Every machine in the fleet reads these, so
  #>  replacing or retiring one never locks the fleet out of its own secrets.
  - path_regex: '(^|/)hosts/[^/]+/secrets/secrets\.yaml$'
    key_groups:
      - age: [*preci, *victus, *recovery]

  #~@ Per-machine service credentials, held on a host:
  #>  hosts/<host>/specs/users/<user>/secrets/machine.yaml
  #>  Keys that exist for attribution -- one per host, so spend can be traced to
  #>  a machine. OpenRouter, NVIDIA and Nous all support multiple keys, so each
  #>  gets one issued here and named for the host it belongs to. These are
  #>  machine-scoped on purpose: only the machine the key was issued for should
  #>  be able to read it, otherwise per-machine attribution records nothing.
  - path_regex: '(^|/)hosts/[^/]+/specs/users/[^/]+/secrets/machine\.yaml$'
    key_groups:
      - age: [*preci, *recovery]

  #~@ Person-owned, held on a host:
  #>  hosts/<host>/specs/users/<user>/secrets/person.yaml
  #>  For credentials that are not per-machine: a personal bot token, a
  #>  single-key subscription, or anything else billed to the human and valid
  #>  everywhere. Readable by them wherever they log in, plus recovery --
  #>  deliberately not by every machine, since a credential that follows a
  #>  person should not be readable by whichever box they sit at.
  - path_regex: '(^|/)hosts/[^/]+/specs/users/[^/]+/secrets/person\.yaml$'
    key_groups:
      - age: [*craole, *recovery]

  #~@ Cross-host ("global") person-owned secrets: API/nix/users/<user>/secrets/person.yaml
  #>  The canonical home for a credential that belongs to a person rather than
  #>  a machine. Ordered after the two on-host rules above, which would
  #>  otherwise match nothing here but are listed first for clarity.
  - path_regex: '(^|/)users/[^/]+/secrets/person\.yaml$'
    key_groups:
      - age: [*craole, *recovery]