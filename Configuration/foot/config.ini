[main]
term = foot
font = monospace:size=18
dpi-aware = yes
pad = 12x12
selection-target = both
initial-color-theme = dark

[scrollback]
lines = 10000
multiplier = 3.0

[cursor]
style=block
blink=yes
blink-rate=500
beam-thickness=1.5

[mouse]
hide-when-typing = yes
alternate-scroll-mode = yes

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
style=dotted
osc8-underline=url-mode
regex=(((https?://|mailto:|ftp://|file:|ssh:|ssh://|git://|tel:|magnet:|ipfs://|ipns://|gemini://|gopher://|news:)|www\.)([0-9a-zA-Z:/?#@!$&*+,;=.~_%^'\-]+|\([]\["0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\)|\[[\(\)"0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\]|"[]\[\(\)0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+"|'[]\[\(\)0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]+')+([0-9a-zA-Z/#@$&*+=~_%^\-]|\([]\["0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\)|\[[\(\)"0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\]|"[]\[\(\)0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+"|'[]\[\(\)0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]+'))

[key-bindings]
scrollback-up-page = Shift+Page_Up
scrollback-down-page = Shift+Page_Down
clipboard-copy = Control+Shift+c XF86Copy
clipboard-paste = Control+Shift+v XF86Paste
search-start = Control+Shift+r
font-increase = Control+plus Control+equal
font-decrease = Control+minus
font-reset = Control+0
spawn-terminal = Control+Shift+n

[search-bindings]
cancel = Escape
commit = Return
find-prev = Control+r
find-next = Control+s

[url-bindings]
cancel = Escape
toggle-url-visible = t
