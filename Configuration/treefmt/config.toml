# ~@ Global Exclusions
[global]
  excludes = [
    ".git/**",
    ".hg/**",
    ".svn/**",
    ".direnv/**",
    "result",
    "result-*",
    "target/**",
    "node_modules/**",
    "build/**",
    "dist/**",
    "out/**",
    "coverage/**",
    "*.min.*",
    "*.map",
    "*.lock",
    "*-lock.*",
    "*.tmp",
  ]

# ~@ Nix
[formatter.statix]
  priority = 1
  command = "sh"
  excludes = []
  includes = ["*.nix"]
  options = [
    "-c",
    'for file in "$@"; do statix fix "$file"; done',
    "_",
  ]

[formatter.alejandra]
  priority = 2
  command = "alejandra"
  includes = ["*.nix"]

# ~@ Shell
[formatter.shellcheck]
  priority = 1
  command = "shellcheck"
  includes = [
    "*.bash*",
    "*.bats",
    "*.dotsrc",
    "*.sh",
  ]

[formatter.shfmt]
  priority = 2
  command = "shfmt"
  options = [
    "--apply-ignore",
    "--binary-next-line",
    "--space-redirects",
    "--case-indent",
    "--indent",
    "2",
    # "--posix",
    "--write",
  ]
  includes = [
    "*.bash*",
    "*.bats",
    "*.dotsrc",
    "*.env*",
    "*.gitignore",
    "*.ignore",
    "*.sh",
    "*.shellcheckrc",
  ]

# ~@ Rust
[formatter.rustfmt]
  priority = 1
  command = "rustfmt"
  includes = ["*.rs"]

[formatter.leptosfmt]
  priority = 2
  command = "leptosfmt"
  includes = ["*.rs"]

# ~@ Python
[formatter.ruff]
  command = "ruff"
  options = ["format"]
  includes = ["*.py", "*.pyi"]

# ~@ Nushell
[formatter.nufmt]
  command = "nufmt"
  includes = ["*.nu"]

# ~@ Zig
[formatter.zig]
  command = "zig"
  options = ["fmt"]
  includes = ["*.zig", "*.zon"]

# ~@ Typst
[formatter.typstyle]
  command = "typstyle"
  options = ["format"]
  includes = ["*.typ", "*.typst"]

# ~@ Lua
[formatter.stylua]
  command = "stylua"
  includes = ["*.lua"]

# ~@ TOML
[formatter.tombi]
  command = "tombi"
  options = ["format"]
  includes = ["*.toml"]

# ~@ YAML
[formatter.yamlfmt]
  command = "yamlfmt"
  includes = ["*.yaml", "*.yml"]

[formatter.actionlint]
  command = "actionlint"
  includes = [
    ".github/workflows/*.yml",
    ".github/workflows/*.yaml",
    ".gitea/workflows/*.yml",
    ".gitea/workflows/*.yaml",
    ".forgejo/workflows/*.yml",
    ".forgejo/workflows/*.yaml"
  ]

# ~@ JavaScript / TypeScript / JSON
[formatter.biome]
  command = "biome"
  options = ["format", "--write"]
  includes = [
    "*.js",
    "*.jsx",
    "*.mjs",
    "*.cjs",
    "*.ts",
    "*.tsx",
    "*.mts",
    "*.cts",
    "*.json",
    "*.jsonc",
    "*.css",
    "*.graphql",
    "*.gql",
  ]

# ~@ Markdown
[formatter.rumdl]
  command = "rumdl"
  options = ["fmt"]
  includes = ["*.md", "*.mdx"]

# ~@ PowerShell
[formatter.powershell]
  command = "pwshfmt"
  includes = ["*.ps1", "*.psm1", "*.psd1"]

