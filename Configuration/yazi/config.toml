[manager]
# linemode = "mtime"
ratio = [1, 2, 2]
sort_by = "natural"
sort_dir_first = true

[preview]
max_height = 1024
max_width = 1024

[plugin]
prepend_previewers = [
  # ~@ RAW images
  { mime = "image/x-sony-arw", run = "arw" },
  { url = "*.arw", run = "arw" },
  { url = "*.ARW", run = "arw" },
  # ~@ Archives
  { mime = "application/*zip", run = "ouch" },
  { mime = "application/x-tar", run = "ouch" },
  { mime = "application/x-bzip2", run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar", run = "ouch" },
  { mime = "application/x-xz", run = "ouch" },
]

[opener]
# Yazi 26.x uses %s/%S placeholders for selected files. The old $1/$@ form
# leaves the opener without a valid file argument, so GUI applications fail.
raw = [
  { run = 'darktable %s', desc = "Darktable", orphan = true, for = "unix" },
  { run = 'rawtherapee %s', desc = "RawTherapee", orphan = true, for = "unix" },
]
image = [
  { run = 'nomacs %s', desc = "Nomacs", orphan = true, for = "unix" },
  { run = 'gimp %s', desc = "GIMP", orphan = true, for = "unix" },
]
display = [{ run = 'zathura %s', desc = "Show in Zathura", orphan = true, for = "unix" }]
edit = [{ run = '$EDITOR %s', block = true, for = "unix" }]
extract = [{ run = 'ouch d -y %s', desc = "Extract here with ouch", for = "unix" }]
generic_open = [{ run = 'xdg-open %s', desc = "Open", orphan = true, for = "unix" }]

[open]
# Keep the explicit image/PDF rules above, and use the desktop's MIME
# association for every other file instead of forcing every file into $EDITOR.
append_rules = [{ url = "*", use = "generic_open" }]
prepend_rules = [
  { url = "*.arw", use = "image" },
  { url = "*.ARW", use = "image" },
  { url = "*.jpg", use = "image" },
  { url = "*.JPG", use = "image" },
  { url = "*.jpeg", use = "image" },
  { url = "*.png", use = "image" },
  { url = "*.epub", use = "display" },
  { url = "*.pdf", use = "display" },
]
