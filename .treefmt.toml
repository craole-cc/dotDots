excludes = [".dotsrc", "LICENSE", "**/node_modules/**", "**/target/**", "**/.git/**", "**/dist/**", "**/build/**", "**/review/**", "**/archive/**", "*.lock", "Assets/**", "*.diff", "*.patch", "AGENTS.md", "**/dump.nix", "**/.bin/**", "**/.config/**", "**README.md", ".zed/**", "Configuration/**", "Documentation/**", "Environment/**", "Modules/global/**", "Modules/nixos/configurations/hosts/QBX/**", "Modules/nixos/scripts/**", "Review/**", "Scripts/**", "Tasks/**", "Templates/**", "*.lock", "*.patch", "package-lock.json", "go.mod", "go.sum", ".gitattributes", ".gitignore", ".gitmodules", ".hgignore", ".svnignore", "LICENSE"]

[formatter.actionlint]
command = "actionlint"
excludes = []
includes = [".github/workflows/*.yml", ".github/workflows/*.yaml", ".gitea/workflows/*.yml", ".gitea/workflows/*.yaml", ".forgejo/workflows/*.yml", ".forgejo/workflows/*.yaml"]
options = []

[formatter.alejandra]
command = "alejandra"
excludes = []
includes = ["*.nix"]
options = []
priority = 2

[formatter.dprint]
command = "dprint"
excludes = []
includes = ["*.json", "*.jsonc", "*.md", "*.yaml", "*.yml", "*.css", "*.scss", "*.sass", "*.less"]
options = ["fmt", "--allow-no-files", "--config", "dprint.json"]
priority = 1

[formatter.harper]
command = "harper-ls"
excludes = []
includes = ["Documentation/**/*.md", "Documentation/**/*.typ"]
options = ["check", "--format", "short"]
priority = 1

[formatter.leptosfmt]
command = "leptosfmt"
excludes = []
includes = ["*.rs"]
options = []
priority = 2

[formatter.ruff-check]
command = "ruff"
excludes = []
includes = ["*.py", "*.pyi"]
options = ["check", "--fix"]
priority = 2

[formatter.ruff-format]
command = "ruff"
excludes = []
includes = ["*.py", "*.pyi"]
options = ["format"]
priority = 1

[formatter.rustfmt]
command = "rustfmt"
excludes = []
includes = ["*.rs"]
options = ["--config", "skip_children=true", "--edition", "2024"]
priority = 1

[formatter.shellcheck]
command = "shellcheck"
excludes = []
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]
options = ["--rcfile", ".shellcheckrc"]
priority = 1

[formatter.shfmt]
command = "shfmt"
excludes = []
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]
options = ["-w", "--apply-ignore", "--binary-next-line", "--space-redirects", "--case-indent", "-i", "2", "-s"]
priority = 2

[formatter.statix]
command = "sh"
excludes = []
includes = ["*.nix"]
options = ["-c", 'for f in "$@"; do statix fix "$f"; done', "_"]
priority = 1

[formatter.stylua]
command = "stylua"
excludes = []
includes = ["*.lua"]
options = []

[formatter.tombi]
command = "tombi"
excludes = []
includes = ["*.toml"]
options = ["format", "--offline"]
priority = 1

[formatter.typos]
command = "typos"
excludes = []
includes = ["*"]
options = ["--write-changes", "--force-exclude"]

[formatter.typstyle]
command = "typstyle"
excludes = []
includes = ["*.typ", "*.typst"]
options = ["-i"]
